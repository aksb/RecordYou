name: CI

# 规则来源：《安卓项目通用配置 · 编译发布篇》
#
#   push 到 main/master 或手动 Run workflow
#     → 版本号用 debug 规则（基准码 + run_number），产物 RecordYou-Debug-v{N}.apk
#     → 上传 Actions Artifact，保留 14 天，不进 Releases 页面
#
#   push v* tag
#     → versionCode = MAJOR×1000000 + MINOR×10000 + PATCH×10，versionName = tag 去掉 v
#     → 产物 RecordYou-Release-{tag}.apk + Magisk 保活模块 zip，发布到 Releases 页面
#
# 为什么 push 也编 release 变体：内部音频依赖 Magisk 模块授予的特权权限，
# 只有 release 包名 com.bnyro.recorder 能继承；debug 变体包名带 .debug，测不到该功能。
# 因此 push 构建同样需要仓库里配置 4 个 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_PASSWORD / KEY_ALIAS），否则编出来的 release 包未签名。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine build parameters
        id: params
        run: |
          set -euo pipefail

          # 基准值来自 app/build.gradle.kts 的字面量行
          BASE_CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -n1 | grep -oE '[0-9]+')
          BASE_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*"(.*)"/\1/')

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IS_TAG=true
            VERSION_NAME="${GITHUB_REF_NAME#v}"

            # 数字段只取 MAJOR.MINOR.PATCH，后缀（R / -beta / -rc1）不参与计算
            CORE="${VERSION_NAME%%-*}"
            CORE="${CORE%R}"
            if ! [[ "$CORE" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::tag 的数字段必须是 MAJOR.MINOR.PATCH 且无前导零，实际为 ${GITHUB_REF_NAME}"
              exit 1
            fi
            VERSION_CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 10000 + BASH_REMATCH[3] * 10 ))

            if [[ "$VERSION_NAME" == *-* ]]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
            APK_NAME="RecordYou-Release-${GITHUB_REF_NAME}.apk"
          else
            IS_TAG=false
            PRERELEASE=false
            VERSION_CODE=$(( BASE_CODE + GITHUB_RUN_NUMBER ))
            VERSION_NAME="${BASE_NAME}.dev${VERSION_CODE}"
            APK_NAME="RecordYou-Debug-v${VERSION_CODE}.apk"
          fi

          {
            echo "version_code=${VERSION_CODE}"
            echo "version_name=${VERSION_NAME}"
            echo "apk_name=${APK_NAME}"
            echo "is_tag=${IS_TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Sync version into app/build.gradle.kts
        run: |
          sed -i -E "s/^([[:space:]]*)versionCode = [0-9]+/\1versionCode = ${{ steps.params.outputs.version_code }}/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*)versionName = \"[^\"]+\"/\1versionName = \"${{ steps.params.outputs.version_name }}\"/" app/build.gradle.kts
          grep -nE 'versionCode = |versionName = "' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > RecordYou.jks
          else
            echo "::warning::KEYSTORE_BASE64 未配置，本次产物未签名，装不上手机"
          fi

      - name: Compile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ "${{ steps.params.outputs.is_tag }}" = "true" ]; then
            ./gradlew assembleRelease :magisk-placeholder:assembleRelease --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Rename APK
        run: |
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK_SRC" "${{ steps.params.outputs.apk_name }}"
          ls -l "${{ steps.params.outputs.apk_name }}"

      - name: Upload test APK
        if: steps.params.outputs.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.params.outputs.apk_name }}
          path: ${{ steps.params.outputs.apk_name }}
          retention-days: 14

      - name: Package Magisk keep-alive module
        if: steps.params.outputs.is_tag == 'true'
        run: |
          cp magisk-placeholder/build/outputs/apk/release/*.apk magisk-module/system/priv-app/RecordYou/RecordYou.apk
          rm -f magisk-module/system/priv-app/RecordYou/.gitkeep
          sed -i "s/^version=.*/version=${{ github.ref_name }}/" magisk-module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ steps.params.outputs.version_code }}/" magisk-module/module.prop
          cd magisk-module
          zip -r "../RecordYou-KeepAlive-Module-Release-${{ github.ref_name }}.zip" . -x "README.md"

      - name: Publish release
        if: steps.params.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RecordYou ${{ github.ref_name }}
          prerelease: ${{ steps.params.outputs.prerelease }}
          files: |
            ${{ steps.params.outputs.apk_name }}
            RecordYou-KeepAlive-Module-Release-${{ github.ref_name }}.zip
